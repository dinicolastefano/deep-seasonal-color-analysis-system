sampling:
  skin:
    kernel_open: 20        # morphological opening
    kmeans_k:    5
    pick:        largest    # cluster più grande

  hair:
    kernel_open: 10
    kmeans_k:    6
    pick:        largest

  lips:
    kernel_open: 5
    kmeans_k:    5
    pick:        saturated  # cluster più saturo

  eyes:
    kernel_open: 1
    kmeans_k:    6
    pick:        eyes       # logica speciale per occhi
    crop_radius: 0
# ─────────────────────────────────────────────────────────────
# CONFIGURAZIONE CAMPIONAMENTO COLORI (skin, hair, lips, eyes)
#
# Con la versione 1.3.2 il filtro HSV usa soglie dinamiche
# basate sui percentili 10-90 di Saturation e Value → non
# servono più sat_min e val_min.
#
# Parametri rimasti:
#
# • kernel_open (int)
#   Dimensione del kernel per morphological opening della maschera.
#   Valori più alti = maschera più pulita (possibile perdita dettagli).
#   Tipico 3-7 (pelle/labbra) oppure 10-20 (capelli).
#
# • kmeans_k (int)
#   Numero di cluster colore da estrarre. 3-6 è la gamma consigliata.
#
# • pick (str)
#   Strategia di scelta del colore dominante:
#     ─ "largest"     → cluster con più pixel
#     ─ "bright"      → cluster con LAB-L massimo
#     ─ "saturated"   → cluster con saturazione massima
#     ─ "eyes"        → heuristica dedicata agli occhi
#
# • crop_radius (int, solo eyes)
#   Ritaglia un quadrato di raggio N intorno alla pupilla
#   per evitare ciglia e pelle.
#
# Se in futuro vuoi tornare a soglie fisse:
#   aggiungi sat_min / val_min sotto la regione desiderata.
# ─────────────────────────────────────────────────────────────
